name: Update GitHub Activity Graph

on:
  schedule:
    # Run at midnight UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push back to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Custom Activity Graph
        # Adjust command to match your project's script (e.g. 'node index.js', 'npm start', or 'node generate.js')
        run: node index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_FOR_GRAPH || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          THEME_MODE: 'gradient'
          GRADIENT_STOPS: '#ffde7a@0%,#75ffe1@31.19804147749513%,#8fbaff@67.58126593345509%,#a0ff61@100%'
          GRADIENT_X1: '17.327975836898666'
          GRADIENT_Y1: '61.02830691501597'
          GRADIENT_X2: '93.6377782142709'
          GRADIENT_Y2: '41.351597015226254'
          BG_EMPTY_LIGHT: '#ebedf0'
          BG_EMPTY_DARK: '#161b22'

      - name: Commit and Push generated SVG
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add activity-graph.svg
          # Only commit and push if the SVG actually changed
          if ! git diff --staged --quiet; then
            git commit -m "chore: update activity graph [skip ci]"
            git pull --rebase origin main || git pull --rebase
            git push
          else
            echo "No changes detected in activity-graph.svg"
          fi
