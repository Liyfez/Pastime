name: Update GitHub Activity Graph

on:
  schedule:
    # Run at midnight UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push back to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Custom Activity Graph
        # Adjust command to match your project's script (e.g. 'node index.js', 'npm start', or 'node generate.js')
        run: node index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_FOR_GRAPH }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          LIGHT_THEME: '#ebedf0,#fe9b9a,#fd4f4e,#fc0403,#b10302'
          DARK_THEME: '#161b22,#650201,#b10302,#fc0403,#fd4f4e'

      - name: Commit and Push generated SVG
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add activity-graph.svg
          # Only commit and push if the SVG actually changed
          if ! git diff --staged --quiet; then
            git commit -m "chore: update activity graph [skip ci]"
            git pull --rebase origin main || git pull --rebase
            git push
          else
            echo "No changes detected in activity-graph.svg"
          fi
